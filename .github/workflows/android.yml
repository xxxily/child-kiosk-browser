name: Android CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PWD: ${{ secrets.KEYSTORE_PWD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PWD: ${{ secrets.KEY_PWD }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for build scripts
        run: chmod +x gradlew scripts/verify-webview-task-manifest.sh

      - name: Run unit tests
        run: ./gradlew :app:testStandardDebugUnitTest :app:testEnhancedDebugUnitTest --stacktrace

      - name: Verify WebView task manifests
        run: |
          scripts/verify-webview-task-manifest.sh app/build/intermediates/merged_manifest/standardDebug/AndroidManifest.xml
          scripts/verify-webview-task-manifest.sh app/build/intermediates/merged_manifest/enhancedDebug/AndroidManifest.xml

      - name: Build Release APKs
        run: ./gradlew :app:assembleStandardRelease :app:assembleEnhancedRelease --stacktrace

      - name: Build Debug APKs
        run: ./gradlew :app:assembleStandardDebug :app:assembleEnhancedDebug --stacktrace

      - name: Rename APK files
        id: rename
        run: |
          mkdir -p artifacts
          VERSION_NAME=$(grep -E 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/standard/release/app-standard-release.apk "artifacts/child-kiosk-browser-${VERSION_NAME}-standard-release.apk"
          cp app/build/outputs/apk/standard/debug/app-standard-debug.apk "artifacts/child-kiosk-browser-${VERSION_NAME}-standard-debug.apk"
          cp app/build/outputs/apk/enhanced/release/app-enhanced-release.apk "artifacts/child-kiosk-browser-${VERSION_NAME}-enhanced-release.apk"
          cp app/build/outputs/apk/enhanced/debug/app-enhanced-debug.apk "artifacts/child-kiosk-browser-${VERSION_NAME}-enhanced-debug.apk"
          ls -lh artifacts

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: child-kiosk-browser-${{ env.VERSION_NAME }}
          path: artifacts/*.apk

      - name: Extract latest release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sed '/^---/q' docs/RELEASE_NOTES.md | grep -v '^---' > artifacts/RELEASE_NOTE_LATEST.md

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: artifacts/RELEASE_NOTE_LATEST.md
          files: |
            artifacts/*.apk
