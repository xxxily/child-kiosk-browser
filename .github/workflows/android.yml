name: Android CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PWD: ${{ secrets.KEYSTORE_PWD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PWD: ${{ secrets.KEY_PWD }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK files
        id: rename
        run: |
          mkdir -p artifacts
          VERSION_NAME=$(grep -E 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "artifacts/child-kiosk-browser-${VERSION_NAME}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/child-kiosk-browser-${VERSION_NAME}-debug.apk"
          ls -lh artifacts

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: child-kiosk-browser-${{ env.VERSION_NAME }}
          path: artifacts/*.apk

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: docs/RELEASE_NOTES.md
          files: |
            artifacts/*.apk
